name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Test (crates clave)
        run: |
          cargo test -p heimdall-core -p heimdall-linux -p heimdall-diagnostics \
            -p heimdall-blackbox -p heimdall-profiles -p heimdall-intelligence

      - name: Build bundles
        working-directory: apps/desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          npm ci || npm install
          npm run tauri build -- --bundles appimage,deb

      - name: Collect artifacts
        run: |
          mkdir -p dist/gh-release
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp -v {} dist/gh-release/ \; 2>/dev/null || true
          cp -v target/release/heimdall-daemon dist/gh-release/ 2>/dev/null || true
          ls -la dist/gh-release/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/gh-release/*
          generate_release_notes: true