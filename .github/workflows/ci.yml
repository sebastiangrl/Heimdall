name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test workspace crates
        run: |
          cargo test -p heimdall-core -p heimdall-linux -p heimdall-telemetry \
            -p heimdall-diagnostics -p heimdall-blackbox -p heimdall-profiles \
            -p heimdall-intelligence -p heimdall-ipc
      - name: fmt
        run: cargo fmt --all -- --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run build