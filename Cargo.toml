[workspace]
resolver = "2"
members = [
    "crates/heimdall-core",
    "crates/heimdall-linux",
    "crates/heimdall-telemetry",
    "crates/heimdall-ipc",
    "crates/heimdall-diagnostics",
    "crates/heimdall-blackbox",
    "crates/heimdall-profiles",
    "crates/heimdall-intelligence",
    "crates/heimdall-guardian",
    "crates/heimdall-investigation",
    "crates/heimdall-daemon",
    "apps/desktop/src-tauri",
]
default-members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Bastian Rivers"]
repository = "https://github.com/sebastiangrl/Heimdall"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true