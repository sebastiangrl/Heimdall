[package]
name = "heimdall-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Heimdall desktop application"

[lib]
name = "heimdall_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
heimdall-core = { path = "../../../crates/heimdall-core" }
heimdall-blackbox = { path = "../../../crates/heimdall-blackbox" }
heimdall-telemetry = { path = "../../../crates/heimdall-telemetry" }
heimdall-intelligence = { path = "../../../crates/heimdall-intelligence" }
heimdall-ipc = { path = "../../../crates/heimdall-ipc" }
heimdall-profiles = { path = "../../../crates/heimdall-profiles" }
heimdall-investigation = { path = "../../../crates/heimdall-investigation" }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
